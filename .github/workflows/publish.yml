name: Publish

# Publishing happens here rather than locally so that npm attaches a
# provenance statement, which n8n requires for verified community nodes.
# `npm run release` bumps the version and pushes the tag; that tag triggers
# this workflow.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships with npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run build
        run: 'npm run build'

      - name: Publish to npm
        run: 'npm publish --provenance --access public'
